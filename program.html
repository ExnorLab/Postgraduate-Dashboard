<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Program details — GradIndex</title>
  <meta name="description" content="Full details for a verified postgraduate program on GradIndex." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F7F6F2;
      --surface: #FFFFFF;
      --sunken: #EFEDE6;
      --ink: #111111;
      --ink-soft: #3A3A37;
      --muted: #5F5F5A;
      --emerald: #0B6E4F;
      --emerald-deep: #085640;
      --emerald-soft: #DCEDE6;
      --margin: clamp(20px, 4vw, 56px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1, h2 {
      font-family: Montserrat, system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 0;
    }
    p { margin: 0; }
    a { color: var(--ink); }
    :focus-visible { outline: 3px solid var(--emerald); outline-offset: 3px; }

    .mark { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); }
    .site-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 20px var(--margin);
    }
    .site-nav { display: flex; gap: 28px; font-size: 15px; }
    .site-nav a { color: var(--ink-soft); text-decoration: none; }
    .site-nav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
    .site-nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }

    .wrap { max-width: 1100px; margin: 0 auto; width: 100%; padding: 0 var(--margin); }

    .back { display: inline-block; margin-top: 16px; font-size: 15px; color: var(--ink-soft); text-decoration: none; }
    .back:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

    .hero { padding: clamp(32px, 5vw, 56px) 0 clamp(32px, 4vw, 48px); }
    .hero__loc { font-size: 15px; color: var(--muted); font-weight: 500; }
    .hero h1 { margin-top: 12px; font-size: clamp(2rem, 1.2rem + 3vw, 3.4rem); max-width: 22ch; }
    .hero__program { margin-top: 14px; font-size: clamp(1.05rem, 1rem + 0.4vw, 1.25rem); color: var(--emerald); font-weight: 600; }

    .facts {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    @media (min-width: 800px) { .facts { grid-template-columns: repeat(4, 1fr); } }
    .fact { background: var(--surface); padding: 20px 22px; }
    .fact__label { display: block; font-size: 13px; color: var(--muted); }
    .fact__value { display: block; margin-top: 6px; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 1.4rem; letter-spacing: -0.02em; line-height: 1.2; }
    .fact__note { display: block; margin-top: 4px; font-size: 13px; color: var(--subtle); }

    .section { padding: clamp(48px, 6vw, 72px) 0 0; }
    .section h2 { font-size: clamp(1.4rem, 1.1rem + 1vw, 1.9rem); margin-bottom: 18px; }
    .section__body { font-size: 16px; color: var(--ink-soft); }
    .placeholder { background: var(--sunken); padding: 28px; color: var(--muted); font-size: 15px; }

    .two { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 800px) { .two { grid-template-columns: 1fr 1fr; } }
    .panel { background: var(--surface); padding: 24px 26px; }
    .panel h3 { font-family: Montserrat, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; margin-bottom: 10px; }
    .panel ul { margin: 0; padding-left: 18px; color: var(--ink-soft); display: grid; gap: 6px; font-size: 15px; }
    .panel p { color: var(--ink-soft); font-size: 15px; }

    .aid-chip {
      display: inline-block; margin-bottom: 10px; padding: 4px 10px;
      background: var(--emerald-soft); color: var(--emerald); font-size: 13px; font-weight: 600;
    }

    .notice { padding: 28px; background: var(--surface); color: var(--muted); font-size: 15px; }
    .notice--error { color: #9B1C1C; background: #FFF4F4; }

    .foot { overflow: hidden; padding: 24px var(--margin) 0; margin-top: auto; }
    .foot__name {
      font-family: Montserrat, sans-serif; font-weight: 800;
      font-size: 17.5vw; letter-spacing: -0.06em; line-height: 0.8;
      margin: 0 0 0 -0.04em;
    }
    .foot__row {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
      padding: 16px 0 24px; font-size: 13px; color: var(--muted);
    }
    .foot__row a { color: var(--ink); text-decoration: none; }
    .foot__row a:hover { text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>

  <header class="site-head">
    <a href="index.html" class="mark">GradIndex</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="courses.html">Courses</a>
      <a href="about.html">About</a>
      <a href="#exnorlabs">Contact</a>
    </nav>
  </header>

  <main class="wrap" id="program">
    <p class="notice">Loading program details…</p>
  </main>

  <footer class="foot">
    <p class="foot__name" aria-hidden="true">GradIndex</p>
    <div class="foot__row">
      <span>A verified index of postgraduate programs, built by ExnorLab.</span>
      <span>Data verified October 2026. <a href="explore.html">Back to the index</a></span>
    </div>
  </footer>

  <script>
    (async function () {
      const root = document.getElementById('program');
      const id = new URLSearchParams(window.location.search).get('id');

      const AID = {
        TA_RA: 'TA / RA tuition waiver',
        MERIT: 'Merit scholarship',
        GOV_STEM: 'Government / STEM grant'
      };

      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const list = items => (items || []).map(i => `<li>${esc(i)}</li>`).join('');

      if (!id) {
        root.innerHTML = `<p class="notice notice--error">No program selected. <a href="explore.html">Browse the index</a>.</p>`;
        return;
      }

      try {
        const res = await fetch('data/ai-ml.json');
        const db = await res.json();
        const u = db.universities.find(item => item.id === id);

        if (!u) {
          root.innerHTML = `<p class="notice notice--error">That program was not found. <a href="explore.html">Browse the index</a>.</p>`;
          return;
        }

        document.title = `${u.name} — GradIndex`;

        root.innerHTML = `
          <a class="back" href="explore.html">&larr; Back to the index</a>

          <section class="hero">
            <span class="hero__loc">${esc(u.country)} · ${esc(u.city)}</span>
            <h1>${esc(u.name)}</h1>
            <p class="hero__program">${esc(u.program)}</p>
          </section>

          <section class="facts" aria-label="Key facts">
            <div class="fact">
              <span class="fact__label">Living and accommodation</span>
              <span class="fact__value">$${Number(u.monthlyLivingCostUSD).toLocaleString('en-US')}</span>
              <span class="fact__note">per month, estimated${u.localCostNote ? ' · ' + esc(u.localCostNote) : ''}</span>
            </div>
            <div class="fact">
              <span class="fact__label">Industry pipeline</span>
              <span class="fact__value">${u.industryScore}/5</span>
              <span class="fact__note">${u.hasCoopOrPlacement ? 'Co-op or placement track' : 'Summer internship track'}</span>
            </div>
            <div class="fact">
              <span class="fact__label">Financial aid</span>
              <span class="fact__value" style="font-size:1.1rem">${esc(AID[u.scholarshipCategory] || u.scholarshipCategory)}</span>
            </div>
            <div class="fact">
              <span class="fact__label">Last verified</span>
              <span class="fact__value" style="font-size:1.1rem">${esc(u.lastVerified)}</span>
            </div>
          </section>

          <section class="section">
            <h2>Overview</h2>
            <div class="placeholder">Programme overview coming soon.</div>
          </section>

          <section class="section">
            <h2>Modules and fit</h2>
            <div class="two">
              <div class="panel">
                <h3>Core modules</h3>
                <ul>${list(u.coreModules)}</ul>
              </div>
              <div class="panel">
                <h3>Applied modules</h3>
                <ul>${list(u.appliedModules)}</ul>
              </div>
            </div>
            <div class="panel" style="margin-top:12px">
              <h3>Fit for an engineering graduate</h3>
              <p>${esc(u.eeeFitNote)}</p>
            </div>
          </section>

          <section class="section">
            <h2>Financial aid</h2>
            <div class="panel">
              <span class="aid-chip">${esc(AID[u.scholarshipCategory] || u.scholarshipCategory)}</span>
              <p>${esc(u.scholarshipDetail)}</p>
            </div>
          </section>

          <section class="section">
            <h2>Industry connections</h2>
            <div class="panel"><p>${esc(u.industryConnection)}</p></div>
          </section>
        `;
      } catch (err) {
        console.error(err);
        root.innerHTML = `<p class="notice notice--error">Couldn't load the program. Serve this site through GitHub Pages or a local web server.</p>`;
      }
    })();
  </script>
</body>
</html>
