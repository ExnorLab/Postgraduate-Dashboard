<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Explorer — GradIndex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Montserrat', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            paper: '#F7F6F2',
            ink: '#111111',
            border: '#DFDDD4',
            emerald: '#0B6E4F',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex flex-col">

  <!-- TOP NAVIGATION & DATA FRESHNESS BAR -->
  <header class="sticky top-0 z-30 border-b border-border bg-paper/95 backdrop-blur-sm px-6 lg:px-12 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-4">
      <a href="index.html" class="font-mono text-xs border border-border bg-white px-3 py-1.5 hover:border-ink transition">
        ← All Courses
      </a>
      <div>
        <h1 id="track-title" class="font-display font-bold text-base sm:text-lg text-ink">Loading Track...</h1>
        <p id="track-subtitle" class="font-mono text-xs text-neutral-500">Verifying dataset...</p>
      </div>
    </div>

    <!-- EXPLICIT YEAR OF LAST UPDATE BADGE -->
    <div class="flex items-center space-x-3">
      <div class="border border-ink bg-white px-3.5 py-1.5 font-mono text-xs flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald"></span>
        <span>DATA LAST UPDATED: <strong id="last-updated-year" class="text-ink">OCTOBER 2026</strong></span>
      </div>
    </div>
  </header>

  <!-- FILTER & SORT CONTROL BAR -->
  <section class="border-b border-border bg-[#F3F1EC] px-6 lg:px-12 py-5">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
      
      <!-- Search -->
      <div>
        <label class="block font-mono text-[11px] uppercase text-neutral-500 mb-1.5">Search University / City</label>
        <input id="search-input" type="text" placeholder="e.g. Waterloo, Salford, Dublin..." 
          class="w-full border border-border bg-white px-3 py-2 text-xs font-mono focus:outline-none focus:border-ink" />
      </div>

      <!-- 1. Country Filter -->
      <div>
        <label class="block font-mono text-[11px] uppercase text-neutral-500 mb-1.5">1. Country Filter</label>
        <select id="country-filter" class="w-full border border-border bg-white px-3 py-2 text-xs font-mono focus:outline-none focus:border-ink">
          <option value="ALL">All 5 Countries (125)</option>
          <option value="USA">USA (25)</option>
          <option value="UK">United Kingdom (25)</option>
          <option value="Canada">Canada (25)</option>
          <option value="Ireland">Ireland (25)</option>
          <option value="Australia">Australia (25)</option>
        </select>
      </div>

      <!-- 2. Scholarship Filter -->
      <div>
        <label class="block font-mono text-[11px] uppercase text-neutral-500 mb-1.5">2. Scholarship / Aid</label>
        <select id="scholarship-filter" class="w-full border border-border bg-white px-3 py-2 text-xs font-mono focus:outline-none focus:border-ink">
          <option value="ALL">All Financial Aid Types</option>
          <option value="TA_RA">TA / RA Tuition Waiver</option>
          <option value="MERIT">Automatic / Merit Scholarship</option>
          <option value="GOV_STEM">Gov / OfS / Vector STEM Grant</option>
        </select>
      </div>

      <!-- 3. Cost of Living Sort -->
      <div>
        <label class="block font-mono text-[11px] uppercase text-neutral-500 mb-1.5">3. Sort: Living Cost</label>
        <select id="cost-sort" class="w-full border border-border bg-white px-3 py-2 text-xs font-mono focus:outline-none focus:border-ink">
          <option value="NONE">Default Order</option>
          <option value="ASC">Lowest Cost First (Ascending)</option>
          <option value="DESC">Highest Cost First (Descending)</option>
        </select>
      </div>

      <!-- 4. Industry Connection Sort -->
      <div>
        <label class="block font-mono text-[11px] uppercase text-neutral-500 mb-1.5">4. Sort: Industry / Internships</label>
        <select id="industry-sort" class="w-full border border-border bg-white px-3 py-2 text-xs font-mono focus:outline-none focus:border-ink">
          <option value="NONE">Default Order</option>
          <option value="HIGH">Highest Industry Score First</option>
          <option value="COOP">Mandatory Co-op / Placement First</option>
        </select>
      </div>

    </div>
  </section>

  <!-- RESULTS COUNT BAR -->
  <div class="px-6 lg:px-12 py-3 border-b border-border flex items-center justify-between font-mono text-xs text-neutral-600 bg-paper">
    <span id="results-count">Showing 0 universities</span>
    <span>Prerequisite Profile: B.Eng Electrical/Electronics (2nd Class) + Data Foundations</span>
  </div>

  <!-- UNIVERSITY CARDS GRID -->
  <main class="flex-1 px-6 lg:px-12 py-8">
    <div id="uni-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
      <!-- Populated by assets/app.js -->
    </div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
