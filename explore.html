<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course explorer — GradIndex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Montserrat', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            paper: '#F7F6F2',
            ink: '#111111',
            line: '#E4E2D9',
            muted: '#5F5F5A',
            emerald: '#0B6E4F',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 border-b border-line bg-paper/90 backdrop-blur-md">
    <div class="mx-auto max-w-[1280px] px-6 lg:px-12 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4 min-w-0">
        <a href="index.html" class="btn shrink-0">&larr; All courses</a>
        <div class="min-w-0">
          <h1 id="track-title" class="display font-bold text-[17px] leading-tight truncate">Loading track…</h1>
          <p id="track-subtitle" class="mono text-xs text-muted mt-0.5">Verifying dataset…</p>
        </div>
      </div>
      <div class="chip chip--accent">
        <span class="dot"></span>
        <span>Data updated <strong id="last-updated-year" class="font-semibold">October 2026</strong></span>
      </div>
    </div>
  </header>

  <!-- FILTERS -->
  <section class="px-6 lg:px-12 pt-6">
    <div class="mx-auto max-w-[1280px] surface p-5">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">

        <div class="lg:col-span-1">
          <label for="search-input" class="field-label">Search university or city</label>
          <input id="search-input" type="search" class="field-input" placeholder="e.g. Waterloo, Salford, Dublin" autocomplete="off" />
        </div>

        <div>
          <label for="country-filter" class="field-label">Country</label>
          <select id="country-filter" class="field-select">
            <option value="ALL">All five countries (125)</option>
            <option value="USA">United States (25)</option>
            <option value="UK">United Kingdom (25)</option>
            <option value="Canada">Canada (25)</option>
            <option value="Ireland">Ireland (25)</option>
            <option value="Australia">Australia (25)</option>
          </select>
        </div>

        <div>
          <label for="scholarship-filter" class="field-label">Scholarship or aid</label>
          <select id="scholarship-filter" class="field-select">
            <option value="ALL">All aid types</option>
            <option value="TA_RA">TA / RA tuition waiver</option>
            <option value="MERIT">Automatic / merit scholarship</option>
            <option value="GOV_STEM">Government / STEM grant</option>
          </select>
        </div>

        <div>
          <label for="cost-sort" class="field-label">Sort by living cost</label>
          <select id="cost-sort" class="field-select">
            <option value="NONE">Default order</option>
            <option value="ASC">Lowest cost first</option>
            <option value="DESC">Highest cost first</option>
          </select>
        </div>

        <div>
          <label for="industry-sort" class="field-label">Sort by industry links</label>
          <select id="industry-sort" class="field-select">
            <option value="NONE">Default order</option>
            <option value="HIGH">Highest industry score first</option>
            <option value="COOP">Co-op / placement first</option>
          </select>
        </div>

      </div>
    </div>
  </section>

  <!-- RESULTS BAR -->
  <div class="px-6 lg:px-12 pt-4 pb-2">
    <div class="mx-auto max-w-[1280px] flex flex-wrap items-center justify-between gap-2 text-sm">
      <span id="results-count" class="text-muted" aria-live="polite">Showing 0 universities</span>
      <span class="text-xs text-muted">Prerequisite profile: B.Eng Electrical/Electronics (2nd class) + data foundations</span>
    </div>
  </div>

  <!-- CARDS -->
  <main class="flex-1 px-6 lg:px-12 pb-16">
    <div id="uni-grid" class="mx-auto max-w-[1280px] grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
      <!-- Populated by assets/app.js -->
    </div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
